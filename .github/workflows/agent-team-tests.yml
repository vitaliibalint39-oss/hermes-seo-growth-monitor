name: Hermes agent team checks
on:
  pull_request:
    paths:
      - 'agent-team/**'
      - '.github/workflows/agent-team-tests.yml'
  push:
    branches:
      - 'feature/hermes-agent-team-readonly'
    paths:
      - 'agent-team/**'
      - '.github/workflows/agent-team-tests.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile public check script
        run: python -m py_compile agent-team/scripts/public_health.py
      - name: Run offline tests (no network requests from tests)
        run: python -m unittest discover -s agent-team/tests -v
